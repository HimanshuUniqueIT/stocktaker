<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin Panel Login" />
  <title>Admin Login</title>

  <!-- 1. Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- 2. Centralized color variables -->
  <link rel="stylesheet" href="assets/css/variables.css" />

  <!-- 3. Custom styles -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="min-h-screen bg-[var(--color-login-bg)] font-sans flex items-center justify-center px-4 py-10">

  <!-- ═══════════════════════════════════════
       LOGIN CARD
  ════════════════════════════════════════ -->
  <div
    id="login-card"
    class="w-full max-w-[440px] bg-white border border-gray-200 rounded-xl shadow-sm px-8 py-10 sm:px-10"
  >

    <!-- ── Logo Placeholder ────────────────── -->
    <div
      id="logo-placeholder"
      class="flex items-center justify-center w-full h-[80px] mb-8"
      aria-label="Company logo placeholder"
    >
      <!--
        Replace the content below with an <img> tag when the logo is ready.
        Example:
          <img src="assets/images/logo.png" alt="Company Logo" class="h-full w-auto object-contain" />
      -->
      <img src="assets/images/logo.png" alt="IH Stocktaker Ltd" class="h-20 w-auto object-contain" />
    </div>

    <!-- ── Heading ─────────────────────────── -->
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-semibold text-slate-800 leading-tight">
        Admin Login
      </h1>
      <p class="mt-1.5 text-sm text-gray-500">
        Sign in to access your admin panel
      </p>
    </div>

    <!-- ── Login Form ──────────────────────── -->
    <form id="login-form" action="dashboard.html" method="GET" novalidate>

      <!-- Username field -->
      <div class="mb-5">
        <label
          for="username"
          class="block mb-1.5 text-sm font-medium text-slate-700"
        >
          Username
        </label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter username"
          autocomplete="username"
          class="w-full h-[46px] px-3.5 text-sm text-slate-800 placeholder-gray-400
                 bg-white border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                 transition-colors duration-150"
        />
      </div>

      <!-- Password field -->
      <div class="mb-7">
        <label
          for="password"
          class="block mb-1.5 text-sm font-medium text-slate-700"
        >
          Password
        </label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter password"
          autocomplete="current-password"
          class="w-full h-[46px] px-3.5 text-sm text-slate-800 placeholder-gray-400
                 bg-white border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                 transition-colors duration-150"
        />
      </div>

      <!-- Submit button -->
      <button href="dashboard.html"
        id="login-btn"
        type="submit"
        class="w-full h-[46px] bg-blue-600 hover:bg-blue-700
               text-white text-sm font-semibold rounded-lg
               focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2
               transition-colors duration-150 cursor-pointer"
      >
        Login
      </button>

    </form>
    <!-- ── End Login Form ──────────────────── -->

  </div>
  <!-- ── End Login Card ─────────────────────── -->

  <!-- App JS -->
  <script src="assets/js/app.js"></script>
</body>
</html>
